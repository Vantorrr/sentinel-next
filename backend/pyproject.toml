[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-next-backend"
version = "2026.1.0"
description = "Sentinel-Next: Decentralized AI Surveillance Platform"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "websockets>=13.0",

    # Async & concurrency
    "anyio>=4.6.0",
    "asyncio-mqtt>=0.16.2",

    # AI / Vision
    "ultralytics>=8.3.0",          # YOLOv11
    "insightface>=0.7.3",          # Face ReID
    "onnxruntime>=1.20.0",         # ONNX inference
    "deepface>=0.0.93",            # Emotion analysis
    "supervision>=0.24.0",         # ByteTrack + annotations
    "Pillow>=11.0.0",
    "numpy>=2.0.0",
    "opencv-python-headless>=4.10.0",

    # LLM
    "anthropic>=0.40.0",
    "openai>=1.55.0",
    "tiktoken>=0.8.0",

    # Database
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "qdrant-client>=1.12.0",       # Vector DB
    "redis[hiredis]>=5.2.0",

    # Streaming / Video
    "av>=14.0.0",                  # PyAV — hardware-accelerated decoding
    "aiortc>=1.9.0",               # WebRTC (optional)

    # Observability
    "prometheus-fastapi-instrumentator>=7.0.0",
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.18.0",

    # Utils
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "orjson>=3.10.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
    "typer>=0.14.0",
    "loguru>=0.7.2",
    "psutil>=6.0.0",
    "aiohttp>=3.11.0",
    "pywebpush>=2.0.0",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
