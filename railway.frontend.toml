# Frontend service config-as-code.
# When adding the 2nd Railway service from the same repo:
# Settings → Config-as-code path = railway.frontend.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.frontend"

[deploy]
# Next listens on Railway $PORT — health on /
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
