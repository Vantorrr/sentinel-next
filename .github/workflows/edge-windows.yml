name: edge-windows

on:
  pull_request:
    paths:
      - "edge-agent/**"
      - ".github/workflows/edge-windows.yml"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r edge-agent/requirements-dev.txt
      - name: Run edge tests
        run: python -m pytest edge-agent/tests -q
        env:
          PYTHONPATH: edge-agent
