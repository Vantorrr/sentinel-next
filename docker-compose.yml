version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# Sentinel-Next · Docker Compose
#
# LOCAL DEV:    docker compose up --build
# RAILWAY:      docker compose --profile railway up --build
#   (Postgres provided by Railway plugin — not started here)
#
# For NVIDIA GPU: uncomment the `deploy` section under `backend`.
# ──────────────────────────────────────────────────────────────────────────────

x-logging: &log
  driver: json-file
  options: { max-size: "50m", max-file: "5" }

services:

  # ── Infrastructure (local only — Railway provides Postgres via plugin) ──────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *log
    profiles: ["local"]
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *log
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.0
    restart: unless-stopped
    logging: *log
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *log
    env_file: .env
    environment:
      DATABASE_URL:       ${DATABASE_URL:-postgresql+asyncpg://sentinel:sentinel@postgres:5432/sentinel}
      REDIS_URL:          ${REDIS_URL:-redis://redis:6379/0}
      QDRANT_URL:         ${QDRANT_URL:-http://qdrant:6333}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      YOLO_DEVICE:        ${YOLO_DEVICE:-cpu}
      DEMO_MODE:          ${DEMO_MODE:-false}
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/app/data/models
      - snapshots:/app/data/snapshots
      - logs:/app/logs
    depends_on:
      postgres: { condition: service_healthy, required: false }
      redis:    { condition: service_healthy }
      qdrant:   { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # ── Uncomment for NVIDIA GPU ─────────────────────────────────────────────
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
        NEXT_PUBLIC_WS_URL:  ${NEXT_PUBLIC_WS_URL:-ws://localhost/ws/events}
    restart: unless-stopped
    logging: *log
    ports:
      - "3000:3000"
    depends_on:
      backend: { condition: service_healthy }

  # ── Nginx ────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging: *log
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pg_data:
  redis_data:
  qdrant_data:
  model_cache:
  snapshots:
  logs:
